services:
  nebula-files:
    image: node:20-alpine
    container_name: nebula-files
    working_dir: /app
    
    volumes:
      - .:/app
    
    ports:
      - "8090:3000"
    
    # La commande qui installe et lance 'serve' automatiquement
    command: npx --yes serve -p 3000
    
    restart: unless-stopped